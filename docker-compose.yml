services:
 mysql:
  image: mysql:8.4
  container_name: chain-logistics-mysql
  restart: unless-stopped
  ports:
  - "3306:3306"
  environment:
   MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
   MYSQL_DATABASE: ${MYSQL_DATABASE}
   MYSQL_USER: ${MYSQL_USER}
   MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  volumes:
  - chain_logistics_mysql_data:/var/lib/mysql

volumes:
 chain_logistics_mysql_data:
  