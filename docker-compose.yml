services:
  mysql:
    image: mysql:8.4
    container_name: chain-logistics-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - chain_logistics_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chain-logistics-streamlit
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8502:8501"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_AGENT_USER: ${MYSQL_AGENT_USER}
      MYSQL_AGENT_PASSWORD: ${MYSQL_AGENT_PASSWORD}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./data/chroma_sop:/app/data/chroma_sop
      - chain_logistics_huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  chain_logistics_mysql_data:
  chain_logistics_huggingface_cache:
