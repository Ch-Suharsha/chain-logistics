services:
  mysql:
    image: mysql:8.4
    container_name: chain-logistics-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - chain_logistics_mysql_data:/var/lib/mysql

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chain-logistics-streamlit
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
    ports:
      - "8502:8501"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_AGENT_USER: ${MYSQL_AGENT_USER}
      MYSQL_AGENT_PASSWORD: ${MYSQL_AGENT_PASSWORD}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./data/chroma_sop:/app/data/chroma_sop
      - chain_logistics_huggingface_cache:/root/.cache/huggingface

volumes:
  chain_logistics_mysql_data:
  chain_logistics_huggingface_cache:
